name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ffmpeg

      - name: Copy FFmpeg binaries to project root
        run: |
          cp $(which ffmpeg) ./ffmpeg
          cp $(which ffprobe) ./ffprobe
          chmod +x ffmpeg ffprobe

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openai-whisper moviepy transformers torch

      - name: Build .app with PyInstaller
        run: |
          pyinstaller \
            --windowed \
            --name "VideoTranslator" \
            --hidden-import=whisper \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            video_translator_portable.py

      - name: Create ZIP for distribution
        run: |
          cd dist
          zip -r "../VideoTranslator-macOS.zip" "VideoTranslator.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoTranslator-macOS
          path: VideoTranslator-macOS.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: VideoTranslator-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
